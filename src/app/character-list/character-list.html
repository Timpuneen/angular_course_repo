<div class="container">
  <h1>Rick and Morty Characters</h1>
  
  <div class="controls">
    <button class="load-btn" (click)="loadCharacters()" [disabled]="loading">
      {{ loading ? 'Loading...' : 'Load Characters' }}
    </button>

    <div class="search-box">
      <input 
        type="text" 
        class="search-input"
        [(ngModel)]="searchTerm"
        (input)="onSearchChange(searchTerm)"
        placeholder="Search characters (e.g., Rick, Morty)..."
      />
      <span class="search-icon"></span>
    </div>
  </div>

  <div class="loading-indicator" *ngIf="loading">
    <div class="spinner"></div>
    <p>Loading characters...</p>
  </div>

  <div class="no-results" *ngIf="noResults && !loading">
    <p>No characters found. Try another search term!</p>
  </div>

  <ul class="character-list" *ngIf="characters.length > 0 && !loading">
    <li class="character-item" *ngFor="let character of characters">
      <img [src]="character.image" [alt]="character.name">
      <div class="character-info">
        <h3>{{ character.name }}</h3>
        <p><strong>Status:</strong> <span [class]="'status-' + character.status.toLowerCase()">{{ character.status }}</span></p>
        <p><strong>Species:</strong> {{ character.species }}</p>
        <p><strong>Origin:</strong> {{ character.origin.name }}</p>
        <p><strong>Location:</strong> {{ character.location.name }}</p>
      </div>
    </li>
  </ul>
</div>
