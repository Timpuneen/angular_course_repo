<div class="card">
  <div class="card-image">
    <img [src]="item.image" [alt]="item.name" />
    <span class="status-badge" [class]="'status-' + item.status.toLowerCase()">
      {{ item.status }}
    </span>
    
    <button 
      class="favorite-button" 
      [class.is-favorite]="isFavorite$ | async"
      [disabled]="isProcessing"
      (click)="toggleFavorite($event)"
      [title]="(isFavorite$ | async) ? 'Remove from favorites' : 'Add to favorites'"
    >
      <svg 
        class="heart-svg" 
        [class.filled]="isFavorite$ | async"
        viewBox="0 0 24 24" 
        xmlns="http://www.w3.org/2000/svg"
      >
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
    </button>
  </div>
  
  <div class="card-content">
    <h3 class="card-title">{{ item.name }}</h3>
    
    <div class="card-info">
      <p class="info-item">
        <span class="info-label">Species:</span>
        <span class="info-value">{{ item.species }}</span>
      </p>
      
      <p class="info-item">
        <span class="info-label">Location:</span>
        <span class="info-value">{{ item.location.name }}</span>
      </p>
    </div>
    
    <a [routerLink]="['/items', item.id]" class="card-button">
      View Details →
    </a>
  </div>
</div>
