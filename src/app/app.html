<nav class="navbar">
  <div class="nav-container">
    <div class="nav-brand">
      <a routerLink="/">Rick & Morty</a>
    </div>
    <ul class="nav-menu">
      <li>
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
      </li>
      <li>
        <a routerLink="/items" routerLinkActive="active">Characters</a>
      </li>
      <li>
        <a routerLink="/favorites" routerLinkActive="active" class="favorites-link">
          Favorites
        </a>
      </li>
      <li>
        <a routerLink="/about" routerLinkActive="active">About</a>
      </li>

      @if (!(currentUser$ | async)) {
        <li>
          <a routerLink="/login" routerLinkActive="active">Login</a>
        </li>
        <li>
          <a routerLink="/signup" routerLinkActive="active" class="signup-link">Sign Up</a>
        </li>
      }
      @else {
        <li>
          <a routerLink="/profile" routerLinkActive="active" class="profile-link">
            <span class="user-avatar">{{ (currentUser$ | async)?.email?.charAt(0) | uppercase }}</span>
            Profile
          </a>
        </li>
        <li>
          <button (click)="onLogout()" class="logout-btn">Logout</button>
        </li>
      }
    </ul>
  </div>
</nav>

<main class="main-content">
  <router-outlet></router-outlet>
</main>

<footer class="footer">
  <p>&copy; 2025 Rick and Morty Explorer. Data from <a href="https://rickandmortyapi.com" target="_blank">Rick and Morty API</a></p>
</footer>
