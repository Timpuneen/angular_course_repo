<div class="signup-container">
  <div class="signup-card">
    <div class="signup-icon">✨</div>
    <h1>Create Account</h1>
    <p class="signup-message">
      Join us today and unlock personalized features
    </p>

    <form (ngSubmit)="onSignup()" #signupForm="ngForm" class="signup-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          email
          placeholder="Enter your email"
          [disabled]="isLoading"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          minlength="6"
          placeholder="At least 6 characters"
          [disabled]="isLoading"
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          required
          minlength="6"
          placeholder="Re-enter your password"
          [disabled]="isLoading"
        />
      </div>

        @if (errorMessage) {
        <div class="error-message">
            {{ errorMessage }}
        </div>
        }
        
      <button 
        type="submit" 
        [disabled]="isLoading || !signupForm.form.valid"
        class="btn btn-primary btn-full"
      >
        {{ isLoading ? 'Creating Account...' : 'Sign Up' }}
      </button>
    </form>

    <div class="divider">
      <span>OR</span>
    </div>

    <div class="login-prompt">
      Already have an account? 
      <a routerLink="/login" class="login-link">Login here</a>
    </div>

    <div class="back-link">
      <a routerLink="/" class="btn btn-secondary">
        ← Back to Home
      </a>
    </div>
  </div>
</div>
